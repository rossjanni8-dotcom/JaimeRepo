name: Build Coords Capture

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Limpiar proyecto viejo
        run: |
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties

      - name: Crear archivos de Gradle
        run: |
          mkdir -p app/src/main/java/com/coordscapture

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CoordsCapture"
          include(":app")
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.coordscapture"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.coordscapture"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

      - name: Crear manifest
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <application
                  android:allowBackup="true"
                  android:label="Coords AMOLED"
                  android:theme="@style/Theme.MaterialComponents.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="coordinate_capture_overlay" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Crear MainActivity
        run: |
          cat << 'EOF' > app/src/main/java/com/coordscapture/MainActivity.kt
          package com.coordscapture

          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.material.button.MaterialButton

          class MainActivity : AppCompatActivity() {

              private lateinit var tvLast: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.BLACK)
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                  }

                  val title = TextView(this).apply {
                      text = "COORDS\nAMOLED"
                      setTextColor(Color.WHITE)
                      textSize = 28f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 60)
                      letterSpacing = 0.1f
                  }

                  val subtitle = TextView(this).apply {
                      text = "Fondo negro puro\nPrecisión al pixel\nFormato X=540 Y=543"
                      setTextColor(Color.parseColor("#AAAAAA"))
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 80)
                  }

                  tvLast = TextView(this).apply {
                      setTextColor(Color.parseColor("#666666"))
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                  }
                  refreshLast()

                  val btn = MaterialButton(this).apply {
                      text = "ESCANEAR"
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      backgroundTintList = ColorStateList.valueOf(Color.parseColor("#222222"))
                      cornerRadius = 24
                      setPadding(80, 40, 80, 40)
                      strokeWidth = 2
                      strokeColor = ColorStateList.valueOf(Color.parseColor("#333333"))
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(this@MainActivity, "Activa 'Mostrar sobre otras apps'", Toast.LENGTH_LONG).show()
                              val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                              startActivity(intent)
                              return@setOnClickListener
                          }
                          val i = Intent(this@MainActivity, CaptureService::class.java).apply { action = "START" }
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                          Toast.makeText(this@MainActivity, "Botón flotante activo - minimizando", Toast.LENGTH_SHORT).show()
                          moveTaskToBack(true)
                      }
                  }

                  val hint = TextView(this).apply {
                      text = "\n\nInstrucciones:\n1. ESCANEAR\n2. Mueve el botón flotante donde no estorbe\n3. Toca el punto exacto → copia X=... Y=...\n4. Toca el flotante para pausar/reanudar"
                      setTextColor(Color.parseColor("#555555"))
                      textSize = 11f
                      gravity = Gravity.CENTER
                  }

                  root.addView(title)
                  root.addView(subtitle)
                  root.addView(tvLast)
                  root.addView(btn)
                  root.addView(hint)

                  setContentView(root)
              }

              private fun refreshLast() {
                  val last = getSharedPreferences("coords", MODE_PRIVATE).getString("last", "") ?: ""
                  tvLast.text = if (last.isNotEmpty()) "Último: $last" else "Sin capturas aún"
              }

              override fun onResume() {
                  super.onResume()
                  refreshLast()
              }
          }
          EOF

      - name: Crear CaptureService
        run: |
          cat << 'EOF' > app/src/main/java/com/coordscapture/CaptureService.kt
          package com.coordscapture

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.app.NotificationCompat

          class CaptureService : Service() {

              private var wm: WindowManager? = null
              private var floatingBtn: View? = null
              private var captureOverlay: View? = null
              private var coordView: TextView? = null
              private var isScanning = true

              private var initialX = 0
              private var initialY = 0
              private var initialTouchX = 0f
              private var initialTouchY = 0f
              private var isDragging = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  startForegroundNotification()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  showAll()
                  return START_STICKY
              }

              private fun overlayType(): Int =
                  if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else WindowManager.LayoutParams.TYPE_PHONE

              private fun startForegroundNotification() {
                  val channelId = "coords_channel"
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel(channelId, "Coords", NotificationManager.IMPORTANCE_LOW)
                      channel.setShowBadge(false)
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
                  }
                  val notif: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Coords AMOLED activo")
                      .setContentText("Toca la pantalla para capturar X=... Y=...")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setOngoing(true)
                      .build()
                  startForeground(1, notif)
              }

              private fun addCaptureOverlay() {
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      PixelFormat.TRANSLUCENT
                  )
                  val captureRoot = FrameLayout(this).apply {
                      setBackgroundColor(Color.parseColor("#01000000"))
                      setOnTouchListener { _, ev ->
                          if (!isScanning) return@setOnTouchListener false
                          if (ev.action == MotionEvent.ACTION_DOWN) {
                              val x = ev.rawX.toInt()
                              val y = ev.rawY.toInt()
                              val formatted = "X=$x Y=$y"
                              saveAndCopy(formatted)
                              showCoord(formatted)
                              vibrate()
                          }
                          true
                      }
                  }
                  wm?.addView(captureRoot, params)
                  captureOverlay = captureRoot
              }

              private fun showAll() {
                  removeAll()
                  addCaptureOverlay()

                  val coordParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = 120
                  }
                  val tv = TextView(this).apply {
                      text = "TOCA UN PUNTO"
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      setBackgroundColor(Color.BLACK)
                      setPadding(24, 12, 24, 12)
                  }
                  wm?.addView(tv, coordParams)
                  coordView = tv

                  val btnParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 100
                      y = 400
                  }
                  val btn = TextView(this).apply {
                      text = "ESCANEANDO"
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setBackgroundColor(Color.parseColor("#222222"))
                      setPadding(32, 20, 32, 20)
                  }

                  btn.setOnTouchListener { v, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = btnParams.x
                              initialY = btnParams.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              isDragging = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - initialTouchX).toInt()
                              val dy = (event.rawY - initialTouchY).toInt()
                              if (kotlin.math.abs(dx) > 10 || kotlin.math.abs(dy) > 10) {
                                  isDragging = true
                                  btnParams.x = initialX + dx
                                  btnParams.y = initialY + dy
                                  wm?.updateViewLayout(v, btnParams)
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!isDragging) toggleScanning()
                              isDragging = false
                              true
                          }
                          else -> false
                      }
                  }

                  wm?.addView(btn, btnParams)
                  floatingBtn = btn
                  isScanning = true
              }

              private fun toggleScanning() {
                  isScanning = !isScanning
                  val btn = floatingBtn as? TextView ?: return
                  if (isScanning) {
                      btn.text = "ESCANEANDO"
                      btn.setBackgroundColor(Color.parseColor("#222222"))
                      if (captureOverlay == null) {
                          addCaptureOverlay()
                          // el botón flotante debe quedar encima del overlay
                          try { wm?.removeView(btn); wm?.addView(btn, btn.layoutParams) } catch (_: Exception) {}
                      }
                      coordView?.visibility = View.VISIBLE
                      Toast.makeText(this, "ESCANEANDO activado", Toast.LENGTH_SHORT).show()
                  } else {
                      btn.text = "DETENIDO"
                      btn.setBackgroundColor(Color.parseColor("#880000"))
                      captureOverlay?.let { try { wm?.removeView(it) } catch (_: Exception) {} }
                      captureOverlay = null
                      coordView?.visibility = View.GONE
                      Toast.makeText(this, "DETENIDO - toca de nuevo para escanear", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun showCoord(formatted: String) {
                  coordView?.text = formatted
                  coordView?.visibility = View.VISIBLE
                  Toast.makeText(this, "$formatted - COPIADO", Toast.LENGTH_SHORT).show()
              }

              private fun saveAndCopy(formatted: String) {
                  getSharedPreferences("coords", MODE_PRIVATE).edit().putString("last", formatted).apply()
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("coords", formatted))
              }

              private fun vibrate() {
                  try {
                      val v = getSystemService(VIBRATOR_SERVICE) as Vibrator
                      if (Build.VERSION.SDK_INT >= 26) {
                          v.vibrate(VibrationEffect.createOneShot(40, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          v.vibrate(40)
                      }
                  } catch (_: Exception) {}
              }

              private fun removeAll() {
                  try { floatingBtn?.let { wm?.removeView(it) } } catch (_: Exception) {}
                  try { captureOverlay?.let { wm?.removeView(it) } } catch (_: Exception) {}
                  try { coordView?.let { wm?.removeView(it) } } catch (_: Exception) {}
                  floatingBtn = null
                  captureOverlay = null
                  coordView = null
              }

              override fun onDestroy() {
                  removeAll()
                  super.onDestroy()
              }
          }
          EOF

      - name: Compilar
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Coords-AMOLED-APK
          path: app/build/outputs/apk/debug/app-debug.apk
